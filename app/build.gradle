plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.appdistribution'
}

android {

    compileSdk 35

    defaultConfig {
        applicationId "com.jaak.kyc"
        minSdkVersion 24
        targetSdk 33
        versionCode 110
        versionName "1.1.0-qa.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        // Read API base URL from local.properties
        Properties properties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            properties.load(new FileInputStream(localPropertiesFile))
        }

        // Set default URL if not specified (usa QA por defecto)
        def apiBaseUrl = properties.getProperty('api.base.url', 'https://api.qa.jaak.ai/')
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures{
        viewBinding = true
        buildConfig = true
    }
    namespace 'com.jaak.kyc'

}

dependencies {

    // Bibliotecas de Kotlin
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version")
    // Android Jetpack
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.fragment:fragment-ktx:1.6.2")
    implementation("androidx.activity:activity-ktx:1.8.2")
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7")
    implementation("androidx.constraintlayout:constraintlayout:2.2.0")
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

// Networking
    implementation("com.squareup.retrofit2:retrofit:2.9.0")
    implementation("com.squareup.retrofit2:converter-gson:2.9.0")
    implementation("com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.2")
    implementation("com.squareup.okhttp3:okhttp:5.0.0-alpha.2")
    
// Guava para ListenableFuture
    implementation("com.google.guava:guava:32.1.3-android")

// Inyección de Dependencias
    implementation("com.google.dagger:hilt-android:$hilt_version")
    kapt("com.google.dagger:hilt-android-compiler:$hilt_version")

// Persistencia de Datos
    implementation("androidx.room:room-ktx:2.6.1")
    kapt("androidx.room:room-compiler:2.6.1")
    implementation("androidx.datastore:datastore-core:1.1.2")

// Corrutinas
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0")

// WorkManager
    implementation("androidx.work:work-runtime-ktx:2.9.0")
    implementation("androidx.hilt:hilt-work:1.0.0")
    kapt("androidx.hilt:hilt-compiler:1.0.0")

// Pruebas
    testImplementation("junit:junit:4.13.2")
    testImplementation("io.mockk:mockk:1.13.10")
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0")
    testImplementation("androidx.arch.core:core-testing:2.2.0")
    testImplementation("androidx.room:room-testing:2.6.0")
    testImplementation("androidx.work:work-testing:2.9.0")
    testImplementation("com.google.truth:truth:1.4.0")
    testImplementation("org.robolectric:robolectric:4.12.1")
    
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.6.1")
    androidTestImplementation("androidx.room:room-testing:2.6.0")
    androidTestImplementation("androidx.work:work-testing:2.9.0")

// Otras utilidades

    implementation("androidx.core:core-splashscreen:1.0.1")
    implementation("androidx.security:security-crypto:1.1.0-alpha06")

    // Picasso - Carga de imágenes desde URL
    implementation 'com.squareup.picasso:picasso:2.8'

    // Google reCAPTCHA Enterprise
    implementation 'com.google.android.recaptcha:recaptcha:18.6.0'

    // Bibliotecas de Google ML Kit y CameraX
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'androidx.camera:camera-video:1.4.1'

    // LightCompressor - requerido por Jaak Visage SDK para compresión de video
    // Usar versión 1.3.2 para compatibilidad con Stamps SDK
    implementation 'com.github.AbedElazizShe:LightCompressor:1.3.2'

    implementation("com.jaak.stampssdk:jaakstamps-sdk:1.2.0")
    implementation("com.jaak.visagesdk:jaakvisage-sdk:1.2.0-beta.6")

}

// Configuración de Firebase App Distribution
firebaseAppDistribution {
    artifactType = "APK"
    groups = "TestersJaak"
    releaseNotes = "KYC Demo App v1.0.0-beta.3 - Servicio 5 offline con estado PENDING para sync correcto"
}
